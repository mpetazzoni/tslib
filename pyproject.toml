[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tslib"
dynamic = ["version"]
description = "A library for dealing with human-readable time offsets and timestamps"
readme = "README.rst"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Maxime Petazzoni", email = "maxime.petazzoni@bulix.org"}]
dependencies = ["pytz", "six"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/mpetazzoni/tslib"
Issues = "https://github.com/mpetazzoni/tslib/issues"

[project.scripts]
ts = "tslib:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "build", "twine"]

[tool.setuptools]
packages = ["tslib"]

[tool.setuptools.dynamic]
version = {attr = "tslib.version.version"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
